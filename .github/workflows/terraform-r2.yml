# yaml-language-server: $schema=https://schemastore.org/github-workflow.json

name: Terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-r2.yml"

  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform-r2.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  check:
    name: Static check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/dotfiles

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive ..

      - name: Initialize providers
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform validate -no-color

  apply:
    name: Plan and apply
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/dotfiles

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Initialize Terraform
        run: terraform init -input=false -lockfile=readonly

      - name: Create saved plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply saved plan
        run: terraform apply -input=false -no-color tfplan
