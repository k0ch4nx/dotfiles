# yaml-language-server: $schema=https://schemastore.org/github-workflow.json

name: Update neovim lock files

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

concurrency:
  group: neovim-lock-update
  cancel-in-progress: false

jobs:
  check:
    name: Check for an existing update
    runs-on: macos-26
    permissions:
      pull-requests: read
    outputs:
      proceed: ${{ steps.pull-request.outputs.proceed }}

    steps:
      - name: Check for an open neovim lock update pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open_pr_number="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --base main \
              --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith("automation/update-neovim-lock-")) | .number' \
              | head -n 1
          )"

          if [[ -n "${open_pr_number}" ]]; then
            printf 'An update pull request is already open: #%s\n' "${open_pr_number}"
            printf 'proceed=false\n' >>"${GITHUB_OUTPUT}"
          else
            printf 'proceed=true\n' >>"${GITHUB_OUTPUT}"
          fi

  update:
    name: Publish an update
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: macos-26
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Neovim
        run: nix profile install nixpkgs#neovim

      - name: Link the neovim configuration
        run: |
          mkdir -p ~/.config
          ln -sfn "${{ github.workspace }}/nix/home/k0ch4nx/files/nvim" ~/.config/nvim

      - name: Update neovim lock files
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/steps/100-update-neovim-plugins.sh
          ./scripts/steps/130-update-neovim-mason-packages.sh

          unexpected_paths="$(
            git diff --name-only \
              -- ':(exclude)nix/home/k0ch4nx/files/nvim/lazy-lock.json' \
              ':(exclude)nix/home/k0ch4nx/files/nvim/mason-lock.json'
          )"
          if [[ -n "${unexpected_paths}" ]]; then
            printf 'Unexpected paths changed:\n%s\n' "${unexpected_paths}" >&2
            exit 1
          fi

          if \
            git diff --quiet \
              -- nix/home/k0ch4nx/files/nvim/lazy-lock.json \
              nix/home/k0ch4nx/files/nvim/mason-lock.json; then
            printf 'changed=false\n' >>"${GITHUB_OUTPUT}"
          else
            printf 'changed=true\n' >>"${GITHUB_OUTPUT}"
          fi

      - name: Create the pull request
        id: create-pull-request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}
          branch-token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          branch: automation/update-neovim-lock
          branch-suffix: timestamp
          base: main
          delete-branch: true
          add-paths: |
            nix/home/k0ch4nx/files/nvim/lazy-lock.json
            nix/home/k0ch4nx/files/nvim/mason-lock.json
          commit-message: "chore: update neovim lock files"
          title: "chore: update neovim lock files"
          body: |
            Automated daily neovim lock file update.

            Build validation is handled by the pull request checks.

      - name: Enable auto-merge
        if: steps.create-pull-request.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN }}
          PR_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
        run: gh pr merge --repo "${GITHUB_REPOSITORY}" --merge --auto "${PR_NUMBER}"
