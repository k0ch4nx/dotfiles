# yaml-language-server: $schema=https://schemastore.org/github-workflow.json

name: Build

on:
  pull_request:

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  darwin:
    name: macOS
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rekey secrets for evaluation
        env:
          DOTFILES_DIR: ${{ github.workspace }}
        run: ./scripts/steps/040-rekey-secrets.sh

      - name: Prepare the Nix cache
        env:
          DOTFILES_DIR: ${{ github.workspace }}
          R2_ACCESS_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.R2_ACCESS_KEY_ID || '' }}
          R2_SECRET_ACCESS_KEY: ${{ github.event_name != 'pull_request' && secrets.R2_SECRET_ACCESS_KEY || '' }}
        run: ./scripts/steps/050-prepare-nix-cache.sh

      - name: Build the configuration
        env:
          DOTFILES_DIR: ${{ github.workspace }}
          DOTFILES_HOST: macbook-pro
        run: ./scripts/steps/060-build-nix-configuration.sh

      - name: Prepare the CI signing key
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          NIX_CACHE_PRIVATE_KEY: ${{ secrets.NIX_CACHE_CI_PRIVATE_KEY }}
        run: |
          private_key="${RUNNER_TEMP}/nix-cache-ci-private-key"

          umask 077
          printf '%s\n' "${NIX_CACHE_PRIVATE_KEY}" >"${private_key}"
          printf 'NIX_CACHE_PRIVATE_KEY_FILE=%s\n' "${private_key}" >>"${GITHUB_ENV}"

      - name: Sign and upload the closure
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_CACHE_BUCKET: ${{ vars.R2_CACHE_BUCKET }}
          DOTFILES_DIR: ${{ github.workspace }}
        run: ./scripts/steps/080-push-nix-cache.sh

  ubuntu-wsl:
    name: Ubuntu WSL
    runs-on: windows-2025
    env:
      BASH_ENV: /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
      DOTFILES_DIR: /tmp/dotfiles
      DOTFILES_HOST: ubuntu-wsl
      DOTFILES_USER: k0ch4nx
      NIX_CACHE_PRIVATE_KEY_FILE: /tmp/nix-cache-ci-private-key
      WSLENV: BASH_ENV/u:DOTFILES_DIR/u:DOTFILES_HOST/u:DOTFILES_USER/u:GITHUB_ACTIONS/u:NIX_EXTRA_CONF/u:R2_ACCESS_KEY_ID/u:R2_SECRET_ACCESS_KEY/u:CLOUDFLARE_ACCOUNT_ID/u:R2_CACHE_BUCKET/u:NIX_CACHE_PRIVATE_KEY/u:NIX_CACHE_PRIVATE_KEY_FILE/u

    steps:
      - name: Install Ubuntu on WSL
        shell: powershell
        run: |
          winget install --id Microsoft.WSL --exact --source winget --accept-source-agreements --accept-package-agreements --silent --verbose

          $env:WSL_UTF8 = 1
          wsl.exe --install Ubuntu --web-download --no-launch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          wsl.exe --distribution Ubuntu -- echo Created a new distro with user: '$(whoami)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkout
        uses: Ubuntu/WSL/.github/actions/wsl-checkout@f861f1083e518354e4c3637b08c0edfcf8bc3d51
        with:
          distro: Ubuntu
          working-dir: /tmp/dotfiles
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: Ubuntu/WSL/.github/actions/wsl-bash@f861f1083e518354e4c3637b08c0edfcf8bc3d51
        env:
          NIX_EXTRA_CONF: experimental-features = nix-command flakes
        with:
          distro: Ubuntu
          working-dir: /tmp/dotfiles
          exec: |
            ./scripts/steps/010-install-nix.sh
            sudo ln -s /nix/var/nix/profiles/default/bin/nix /usr/local/bin/nix

      - name: Rekey secrets for evaluation
        uses: Ubuntu/WSL/.github/actions/wsl-bash@f861f1083e518354e4c3637b08c0edfcf8bc3d51
        with:
          distro: Ubuntu
          working-dir: /tmp/dotfiles
          exec: ./scripts/steps/040-rekey-secrets.sh

      - name: Prepare the Nix cache
        uses: Ubuntu/WSL/.github/actions/wsl-bash@f861f1083e518354e4c3637b08c0edfcf8bc3d51
        env:
          R2_ACCESS_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.R2_ACCESS_KEY_ID || '' }}
          R2_SECRET_ACCESS_KEY: ${{ github.event_name != 'pull_request' && secrets.R2_SECRET_ACCESS_KEY || '' }}
        with:
          distro: Ubuntu
          working-dir: /tmp/dotfiles
          exec: ./scripts/steps/050-prepare-nix-cache.sh

      - name: Build the configuration
        uses: Ubuntu/WSL/.github/actions/wsl-bash@f861f1083e518354e4c3637b08c0edfcf8bc3d51
        with:
          distro: Ubuntu
          working-dir: /tmp/dotfiles
          exec: ./scripts/steps/060-build-nix-configuration.sh

      - name: Prepare the CI signing key
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: Ubuntu/WSL/.github/actions/wsl-bash@f861f1083e518354e4c3637b08c0edfcf8bc3d51
        env:
          NIX_CACHE_PRIVATE_KEY: ${{ secrets.NIX_CACHE_CI_PRIVATE_KEY }}
        with:
          distro: Ubuntu
          working-dir: /tmp/dotfiles
          exec: |
            set -euo pipefail

            umask 077
            printf '%s\n' "${NIX_CACHE_PRIVATE_KEY}" >"${NIX_CACHE_PRIVATE_KEY_FILE}"

      - name: Sign and upload the closure
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: Ubuntu/WSL/.github/actions/wsl-bash@f861f1083e518354e4c3637b08c0edfcf8bc3d51
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_CACHE_BUCKET: ${{ vars.R2_CACHE_BUCKET }}
        with:
          distro: Ubuntu
          working-dir: /tmp/dotfiles
          exec: ./scripts/steps/080-push-nix-cache.sh
