# yaml-language-server: $schema=https://schemastore.org/github-workflow.json

name: Build

on:
  pull_request:

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  darwin:
    name: macOS
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare the Nix cache
        env:
          DOTFILES_DIR: ${{ github.workspace }}
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: ./scripts/steps/040-prepare-nix-cache.sh

      - name: Build the configuration
        env:
          DOTFILES_DIR: ${{ github.workspace }}
          DOTFILES_HOST: macbook-pro
          NIX_CACHE_CLOSURE_FILE: ${{ runner.temp }}/nix-cache-closure
        run: ./scripts/steps/060-build-nix-configuration.sh

      - name: Prepare the CI signing key
        if: &main-only >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          NIX_CACHE_PRIVATE_KEY: ${{ secrets.NIX_CACHE_CI_PRIVATE_KEY }}
        run: |
          private_key="${RUNNER_TEMP}/nix-cache-ci-private-key"

          umask 077
          printf '%s\n' "${NIX_CACHE_PRIVATE_KEY}" >"${private_key}"
          printf 'NIX_CACHE_PRIVATE_KEY_FILE=%s\n' "${private_key}" >>"${GITHUB_ENV}"

      - name: Sign and upload the closure
        if: *main-only
        env: &r2-env-darwin
          DOTFILES_DIR: ${{ github.workspace }}
          NIX_CACHE_CLOSURE_FILE: ${{ runner.temp }}/nix-cache-closure
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: ./scripts/steps/080-push-nix-cache.sh

      - name: Touch the cache
        if: *main-only
        env: *r2-env-darwin
        run: ./scripts/steps/081-touch-nix-cache.sh

  ubuntu-wsl:
    name: Ubuntu WSL
    runs-on: windows-2025
    env:
      BASH_ENV: /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
      DOTFILES_DIR: /tmp/dotfiles
      DOTFILES_HOST: ubuntu-wsl
      DOTFILES_USER: k0ch4nx
      NIX_CACHE_PRIVATE_KEY_FILE: /tmp/nix-cache-ci-private-key
      NIX_CACHE_CLOSURE_FILE: /tmp/nix-cache-closure
      WSLENV: BASH_ENV/u:DOTFILES_DIR/u:DOTFILES_HOST/u:DOTFILES_USER/u:GITHUB_ACTIONS/u:NIX_EXTRA_CONF/u:TF_TOKEN_app_terraform_io/u:NIX_CACHE_PRIVATE_KEY/u:NIX_CACHE_PRIVATE_KEY_FILE/u:NIX_CACHE_CLOSURE_FILE/u

    steps:
      - name: Restore Ubuntu WSL installer cache
        id: restore-wsl-installer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}\wsl\ubuntu-26.04.1-wsl-amd64.wsl
          key: wsl-installer-ubuntu-26.04.1-amd64-sha256-48d56724b5c8e60f24893e83e73bbb58c60b3ca22fba3da977075420acd54104

      - name: Download and verify Ubuntu WSL installer
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          shell: powershell
          command: |
            $env:WSL_UTF8 = 1

            $installerDir = "${env:RUNNER_TEMP}\wsl"
            $installerPath = "${installerDir}\ubuntu-26.04.1-wsl-amd64.wsl"
            $expectedSha256 = "48d56724b5c8e60f24893e83e73bbb58c60b3ca22fba3da977075420acd54104"

            New-Item -ItemType Directory -Force -Path $installerDir | Out-Null

            $needsDownload = $true
            if (Test-Path $installerPath) {
              $actualSha256 = (Get-FileHash -Algorithm SHA256 -Path $installerPath).Hash.ToLower()
              if ($actualSha256 -eq $expectedSha256) {
                $needsDownload = $false
              } else {
                Remove-Item $installerPath -Force
              }
            }

            if ($needsDownload) {
              curl.exe `
                --fail `
                --location `
                --retry 5 `
                --retry-all-errors `
                --retry-delay 5 `
                --connect-timeout 30 `
                --output $installerPath `
                'https://releases.ubuntu.com/26.04/ubuntu-26.04.1-wsl-amd64.wsl'

              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }

            $finalSha256 = (Get-FileHash -Algorithm SHA256 -Path $installerPath).Hash.ToLower()
            if ($finalSha256 -ne $expectedSha256) {
              Write-Error "SHA-256 mismatch for Ubuntu WSL installer: expected ${expectedSha256}, got ${finalSha256}"
              exit 1
            }

      - name: Register Ubuntu WSL distribution
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 15
          max_attempts: 2
          shell: powershell
          command: |
            $env:WSL_UTF8 = 1

            $installerPath = "${env:RUNNER_TEMP}\wsl\ubuntu-26.04.1-wsl-amd64.wsl"
            $installLocation = "${env:RUNNER_TEMP}\wsl\Ubuntu"

            wsl.exe --distribution Ubuntu --exec true 2>$null
            $healthy = $LASTEXITCODE -eq 0

            if (-not $healthy) {
              wsl.exe --terminate Ubuntu 2>$null
              wsl.exe --unregister Ubuntu 2>$null

              if (Test-Path $installLocation) {
                Remove-Item $installLocation -Recurse -Force
              }
              New-Item -ItemType Directory -Force -Path $installLocation | Out-Null

              wsl.exe --install --from-file $installerPath --name Ubuntu --location $installLocation --no-launch
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }

            wsl.exe --distribution Ubuntu -- cat /etc/os-release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkout
        uses: Ubuntu/WSL/.github/actions/wsl-checkout@f861f1083e518354e4c3637b08c0edfcf8bc3d51
        with:
          distro: Ubuntu
          working-dir: /tmp/dotfiles
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: Ubuntu/WSL/.github/actions/wsl-bash@f861f1083e518354e4c3637b08c0edfcf8bc3d51
        env:
          NIX_EXTRA_CONF: experimental-features = nix-command flakes
        with:
          distro: Ubuntu
          working-dir: /tmp/dotfiles
          exec: |
            ./scripts/steps/010-install-nix.sh
            sudo ln -s /nix/var/nix/profiles/default/bin/nix /usr/local/bin/nix

      - name: Prepare the Nix cache
        uses: Ubuntu/WSL/.github/actions/wsl-bash@f861f1083e518354e4c3637b08c0edfcf8bc3d51
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        with:
          distro: Ubuntu
          working-dir: /tmp/dotfiles
          exec: ./scripts/steps/040-prepare-nix-cache.sh

      - name: Build the configuration
        uses: Ubuntu/WSL/.github/actions/wsl-bash@f861f1083e518354e4c3637b08c0edfcf8bc3d51
        with:
          distro: Ubuntu
          working-dir: /tmp/dotfiles
          exec: ./scripts/steps/060-build-nix-configuration.sh

      - name: Prepare the CI signing key
        if: *main-only
        uses: Ubuntu/WSL/.github/actions/wsl-bash@f861f1083e518354e4c3637b08c0edfcf8bc3d51
        env:
          NIX_CACHE_PRIVATE_KEY: ${{ secrets.NIX_CACHE_CI_PRIVATE_KEY }}
        with:
          distro: Ubuntu
          working-dir: /tmp/dotfiles
          exec: |
            set -euo pipefail

            umask 077
            printf '%s\n' "${NIX_CACHE_PRIVATE_KEY}" >"${NIX_CACHE_PRIVATE_KEY_FILE}"

      - name: Sign and upload the closure
        if: *main-only
        uses: Ubuntu/WSL/.github/actions/wsl-bash@f861f1083e518354e4c3637b08c0edfcf8bc3d51
        env: &r2-env-wsl
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        with:
          distro: Ubuntu
          working-dir: /tmp/dotfiles
          exec: ./scripts/steps/080-push-nix-cache.sh

      - name: Touch the cache
        if: *main-only
        uses: Ubuntu/WSL/.github/actions/wsl-bash@f861f1083e518354e4c3637b08c0edfcf8bc3d51
        env: *r2-env-wsl
        with:
          distro: Ubuntu
          working-dir: /tmp/dotfiles
          exec: ./scripts/steps/081-touch-nix-cache.sh
