# yaml-language-server: $schema=https://schemastore.org/github-workflow.json

name: OpenTofu

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/opentofu-r2.yml"

  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/opentofu-r2.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opentofu
  cancel-in-progress: false

jobs:
  check:
    name: Static check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/dotfiles

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.9"
          tofu_wrapper: false

      - name: Check formatting
        run: tofu fmt -check -recursive ..

      - name: Initialize providers
        run: tofu init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: tofu validate -no-color

  apply:
    name: Plan and apply
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/dotfiles

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
      TF_TOKEN_k0ch4nx_scalr_io: ${{ secrets.SCALR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.9"
          tofu_wrapper: false

      - name: Initialize OpenTofu
        run: tofu init -input=false -lockfile=readonly

      - name: Create saved plan
        run: tofu plan -input=false -no-color -out=tfplan

      - name: Apply saved plan
        run: tofu apply -input=false -no-color tfplan
